name: Notificar Novo Torneio

on:
  schedule:
    - cron: '*/30 * * * *' # Roda automaticamente a cada 30 minutos
  workflow_dispatch:
    inputs:
      teste:
        description: 'Enviar notificação de teste agora?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar planilha e notificar
        env:
          MODO_TESTE: ${{ github.event.inputs.teste || 'false' }}
        run: python notificar_torneio.py

      - name: Salvar última data verificada
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ultima_data.txt
            git commit -m "Atualiza ultima data notificada"
            git push
          fi
